<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Style Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="startScreen" class="screen">
        <h1>Geometry Jumper</h1>
        <canvas id="menuDemo" width="800" height="240"></canvas>
        <div id="menuControls">
            <div id="levelSelect">
                <label for="levels">Choose Level:</label>
                <select id="levels">
                    <option value="0">Forest (Calm)</option>
                    <option value="1">Desert (Sunny)</option>
                    <option value="2">Neon (Fast)</option>
                    <option value="3">Crystal Caverns (Mystic)</option>
                        <option value="4">Sky Ruins (Flips)</option>
                        <option value="5">Lava Depths (Holes)</option>
                        <option value="6">Cyber Grid (Vertical)</option>
                        <option value="7">Haunted Woods (Ghosts)</option>
                        <option value="8">Frozen Peaks (Slippery)</option>
                        <option value="9">Rainbow Road (Music Sync)</option>
                </select>
            </div>
            <button id="muteBtn" class="big-btn">Unmute</button>
        </div>
        <label for="playerName">Player Name:</label>
        <input id="playerName" type="text" maxlength="12" placeholder="Enter your name" style="font-size:1.2em; padding:8px; margin:10px; border-radius:8px; border:1px solid #ccc;">
        <button id="startBtn" class="big-btn">Start Game</button>
        <div id="instructions">
            <h3>How to Play</h3>
            <ul>
                <li>Jump to avoid obstacles (Space or click/tap).</li>
                <li>Twisters appear in some levels and move unpredictably.</li>
                <li>If you hit an obstacle you explode — try again with space.</li>
                <li>Choose level styles and music before starting.</li>
            </ul>
        </div>
        <div id="highScoreDisplay" style="margin-top:20px; font-size:1.2em;"></div>
        <div id="statsDisplay" style="margin-top:16px; font-size:1.1em;"></div>
    </div>
    <div id="gameContainer">
        <!-- Main game canvas -->
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <!-- Progress bar for level completion -->
        <div id="progressBarContainer" style="width:800px; height:18px; background:#222; border-radius:8px; margin:8px auto 0 auto; box-shadow:0 2px 8px #0003; overflow:hidden;">
            <div id="progressBar" style="height:100%; width:0%; background:linear-gradient(90deg,#00eaff,#ff0055); border-radius:8px;"></div>
        </div>
        <!-- Score display -->
        <div id="score">Score: 0</div>
    </div>
    <div id="gameOverScreen" class="screen">
        <h1>Game Over</h1>
        <div id="finalScore"></div>
        <button id="restartBtn" class="big-btn">Retry (Space)</button>
        <button id="mainMenuBtn" class="big-btn">Main Menu</button>
    </div>
    <div id="endingScreen" class="screen" style="display:none;">
        <h1 id="endingTitle">Level Complete!</h1>
        <div id="endingStats"></div>
        <button id="nextLevelBtn" class="big-btn">Next Level</button>
        <button id="endingMenuBtn" class="big-btn">Main Menu</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
